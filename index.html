<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rastek ® · Future Hub</title>
    <style>
        /* ============================================================
                   ROOT VARIABLES & ADVANCED PROPERTIES
                   ============================================================ */
        @property --grad-angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        :root {
            --bg: #040406;
            --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.06);
            --text: #f5f5f7;
            --accent: #007aff;
            --accent-glow: rgba(0, 122, 255, 0.4);
            --radius: 24px;
            --transition: 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* ============================================================
                   ЖИДКИЕ ОРБЫ (передовые частицы с градиентным движением)
                   ============================================================ */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px) saturate(1.8);
            pointer-events: none;
            z-index: 0;
            will-change: transform, opacity;
            animation: orbFloat 24s ease-in-out infinite alternate;
        }

        .orb1 {
            width: 380px;
            height: 380px;
            background: conic-gradient(from var(--grad-angle), #7b2ffc, #b06aff, #007aff, #7b2ffc);
            top: -120px;
            left: -100px;
            animation-delay: 0s;
            opacity: 0.5;
        }

        .orb2 {
            width: 450px;
            height: 450px;
            background: conic-gradient(from var(--grad-angle), #ff3d7f, #ff8a5c, #ffd700, #ff3d7f);
            bottom: -150px;
            right: -120px;
            animation-delay: -8s;
            opacity: 0.35;
        }

        .orb3 {
            width: 300px;
            height: 300px;
            background: conic-gradient(from var(--grad-angle), #00d4ff, #0088cc, #00d4ff);
            top: 40%;
            left: 50%;
            animation-delay: -16s;
            opacity: 0.25;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(60px, -80px) scale(1.15) rotate(12deg); }
            50% { transform: translate(-40px, 60px) scale(0.85) rotate(-8deg); }
            75% { transform: translate(30px, -30px) scale(1.05) rotate(4deg); }
            100% { transform: translate(-20px, 20px) scale(1.0) rotate(-2deg); }
        }

        .orb1, .orb2, .orb3 {
            animation: orbFloat 24s ease-in-out infinite alternate, orbGradient 12s linear infinite;
        }

        @keyframes orbGradient {
            to { --grad-angle: 360deg; }
        }

        /* ============================================================
                   ОСНОВНОЙ КОНТЕЙНЕР
                   ============================================================ */
        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ============================================================
                   ПРЕМИУМ-ХЕДЕР
                   ============================================================ */
        .header {
            text-align: center;
            padding: 20px 0 10px;
            animation: fadeUp 0.8s ease both;
        }

        .logo {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #fff 60%, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .logo span {
            font-size: 13px;
            vertical-align: super;
            opacity: 0.4;
            -webkit-text-fill-color: #888;
        }

        .subhead {
            color: #666;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-top: 6px;
            opacity: 0.7;
        }

        /* ============================================================
                   ВКЛАДКИ
                   ============================================================ */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 60px;
            border: 0.5px solid var(--border);
            animation: fadeUp 0.8s ease 0.1s both;
        }

        .tab {
            flex: 1;
            padding: 12px 0;
            border-radius: 40px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .tab:active { transform: scale(0.94); }

        /* ============================================================
                   КАРТОЧКИ (GLASSMORPHISM 2.0)
                   ============================================================ */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeUp 0.8s ease 0.2s both;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 0.5px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 30px rgba(0, 122, 255, 0.15);
        }

        .card:hover::before { opacity: 1; }
        .card:active { transform: scale(0.97); transition-duration: 0.1s; }

        .card-left { display: flex; flex-direction: column; gap: 2px; }
        .card-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
        .card-desc { font-size: 13px; color: #888; font-weight: 400; }
        .card-arrow { color: #555; font-size: 18px; transition: var(--transition); }
        .card:hover .card-arrow { color: var(--accent); transform: translateX(4px); }

        .card-accent { border-color: rgba(0, 122, 255, 0.3); background: rgba(0, 122, 255, 0.05); }
        .card-accent .card-title { color: var(--accent); }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ============================================================
                   МОДАЛЬНОЕ ОКНО
                   ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(28px) saturate(1.2);
            -webkit-backdrop-filter: blur(28px) saturate(1.2);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.open { display: flex; animation: fadeIn 0.35s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal {
            background: rgba(18, 18, 24, 0.92);
            backdrop-filter: blur(48px);
            -webkit-backdrop-filter: blur(48px);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            padding: 24px 20px 20px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.8);
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .modal-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

        .modal-close {
            width: 40px; height: 40px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            color: #fff; font-size: 20px;
            cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }

        .modal-close:active { transform: scale(0.88); background: rgba(255, 255, 255, 0.12); }

        .game-container { display: flex; flex-direction: column; align-items: center; gap: 14px; }
        canvas {
            background: #0a0a0f; border-radius: 20px;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 6px 32px rgba(0, 0, 0, 0.6);
            width: 100%; max-width: 280px; height: auto;
            aspect-ratio: 1 / 1; touch-action: none;
        }

        .dpad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px 50px;
            gap: 6px; justify-content: center;
        }

        .dpad-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px; color: #fff; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; touch-action: none; user-select: none;
        }

        .dpad-btn:active { background: rgba(255, 255, 255, 0.12); transform: scale(0.90); }
        .dpad-empty { visibility: hidden; }

        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
        .calc-display {
            grid-column: span 4; background: rgba(255, 255, 255, 0.03);
            border-radius: 16px; padding: 18px 22px; text-align: right;
            font-size: 32px; font-weight: 300; border: 0.5px solid rgba(255, 255, 255, 0.04);
            min-height: 64px; display: flex; align-items: center; justify-content: flex-end;
            overflow: hidden; color: #fff;
        }
        .calc-btn {
            background: rgba(255, 255, 255, 0.04); border: 0.5px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px; padding: 16px 0; font-size: 20px; color: #fff; cursor: pointer; text-align: center;
        }
        .calc-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.10); }
        .calc-btn.operator { background: rgba(0, 122, 255, 0.12); color: var(--accent); }
        .calc-btn.equal { background: var(--accent); color: #fff; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="wrapper">
        <header class="header">
            <div class="logo">Rastek <span>®</span></div>
            <div class="subhead">Next‑Gen Systems</div>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="pro">PRO</button>
            <button class="tab" data-tab="arcade">ARCADE</button>
        </div>

        <div id="tab-pro" class="tab-pane active">
            <div class="card-list">
                <div class="card card-accent" onclick="window.location='techspecs.html'">
                    <div class="card-left">
                        <span class="card-title">TechSpecs Pro</span>
                        <span class="card-desc">Аналитика & бенчмарки</span>
                    </div>
                    <span class="card-arrow">↗</span>
                </div>
                <div class="card" onclick="alert('Модуль в разработке')">
                    <div class="card-left">
                        <span class="card-title">System Tools</span>
                        <span class="card-desc">Оптимизация и конфиг</span>
                    </div>
                    <span class="card-arrow">↗</span>
                </div>
                <div class="card" onclick="alert('Скоро')">
                    <div class="card-left">
                        <span class="card-title">AI Assistant</span>
                        <span class="card-desc">Нейросетевой помощник</span>
                    </div>
                    <span class="card-arrow">↗</span>
                </div>
            </div>
        </div>

        <div id="tab-arcade" class="tab-pane">
            <div class="card-list">
                <div class="card" data-game="snake">
                    <div class="card-left">
                        <span class="card-title">🐍 Retro Snake</span>
                        <span class="card-desc">Классика с D‑Pad</span>
                    </div>
                    <span class="card-arrow">▶</span>
                </div>
                <div class="card" data-game="tetris">
                    <div class="card-left">
                        <span class="card-title">🧱 Tetris</span>
                        <span class="card-desc">Головоломка на время</span>
                    </div>
                    <span class="card-arrow">▶</span>
                </div>
                <div class="card" data-game="calc">
                    <div class="card-left">
                        <span class="card-title">🧮 Калькулятор</span>
                        <span class="card-desc">iOS‑стиль</span>
                    </div>
                    <span class="card-arrow">▶</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <span id="modal-title" class="modal-title">Игра</span>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>
    <!-- ===== JS LOGIC ===== -->
    <script>
        // Вкладки
        document.querySelectorAll('.tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // Модалка
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        let gameLoop = null;

        function closeModal() {
            modal.classList.remove('open');
            if (gameLoop) clearInterval(gameLoop);
        }

        document.querySelectorAll('[data-game]').forEach(card => {
            card.addEventListener('click', () => {
                const game = card.dataset.game;
                modal.classList.add('open');
                if (game === 'snake') initSnake();
                if (game === 'tetris') initTetris();
                if (game === 'calc') initCalc();
            });
        });

        // 1. ЗМЕЙКА
        function initSnake() {
            modalTitle.innerText = "Retro Snake";
            modalBody.innerHTML = `
                <div class="game-container">
                    <canvas id="canvas" width="200" height="200"></canvas>
                    <div class="dpad">
                        <div class="dpad-empty"></div>
                        <button class="dpad-btn" onclick="setSnakeDir('UP')">▲</button>
                        <div class="dpad-empty"></div>
                        <button class="dpad-btn" onclick="setSnakeDir('LEFT')">◄</button>
                        <button class="dpad-btn" onclick="setSnakeDir('DOWN')">▼</button>
                        <button class="dpad-btn" onclick="setSnakeDir('RIGHT')">►</button>
                    </div>
                </div>
            `;

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            let snake = [{x: 5, y: 5}];
            let dir = 'RIGHT';
            let nextDir = 'RIGHT';
            let food = {x: 8, y: 8};
            const gridSize = 20;
            const tileCount = 10;

            window.setSnakeDir = (d) => {
                if (d === 'UP' && dir !== 'DOWN') nextDir = 'UP';
                if (d === 'DOWN' && dir !== 'UP') nextDir = 'DOWN';
                if (d === 'LEFT' && dir !== 'RIGHT') nextDir = 'LEFT';
                if (d === 'RIGHT' && dir !== 'LEFT') nextDir = 'RIGHT';
            };

            function placeFood() {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                snake.forEach(part => {
                    if (part.x === food.x && part.y === food.y) placeFood();
                });
            }

            if (gameLoop) clearInterval(gameLoop);

            gameLoop = setInterval(() => {
                dir = nextDir;
                let head = { ...snake[0] };

                if (dir === 'UP') head.y--;
                if (dir === 'DOWN') head.y++;
                if (dir === 'LEFT') head.x--;
                if (dir === 'RIGHT') head.x++;

                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || snake.some(part => part.x === head.x && part.y === head.y)) {
                    clearInterval(gameLoop);
                    ctx.fillStyle = 'rgba(255, 59, 48, 0.3)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);
                    setTimeout(initSnake, 1800);
                    return;
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    placeFood();
                } else {
                    snake.pop();
                }

                ctx.fillStyle = '#0a0a0f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#007aff';
                snake.forEach(part => {
                    ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
                });

                ctx.fillStyle = '#ff3b30';
                ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);

            }, 170);
        }

        // 2. ТЕТРИС
        function initTetris() {
            modalTitle.innerText = "Tetris";
            modalBody.innerHTML = `<div style="text-align:center; padding: 20px; color: #888; font-size: 14px;">Модуль Tetris в разработке...</div>`;
        }

        // 3. КАЛЬКУЛЯТОР
        function initCalc() {
            modalTitle.innerText = "Калькулятор";
            modalBody.innerHTML = `
                <div class="calc-grid">
                    <div id="calc-display" class="calc-display">0</div>
                    <button class="calc-btn" onclick="calcInput('C')">C</button>
                    <button class="calc-btn" onclick="calcInput('(')">(</button>
                    <button class="calc-btn" onclick="calcInput(')')">)</button>
                    <button class="calc-btn operator" onclick="calcInput('/')">÷</button>
                    <button class="calc-btn" onclick="calcInput('7')">7</button>
                    <button class="calc-btn" onclick="calcInput('8')">8</button>
                    <button class="calc-btn" onclick="calcInput('9')">9</button>
                    <button class="calc-btn operator" onclick="calcInput('*')">×</button>
                    <button class="calc-btn" onclick="calcInput('4')">4</button>
                    <button class="calc-btn" onclick="calcInput('5')">5</button>
                    <button class="calc-btn" onclick="calcInput('6')">6</button>
                    <button class="calc-btn operator" onclick="calcInput('-')">-</button>
                    <button class="calc-btn" onclick="calcInput('1')">1</button>
                    <button class="calc-btn" onclick="calcInput('2')">2</button>
                    <button class="calc-btn" onclick="calcInput('3')">3</button>
                    <button class="calc-btn operator" onclick="calcInput('+')">+</button>
                    <button class="calc-btn" style="grid-column: span 2" onclick="calcInput('0')">0</button>
                    <button class="calc-btn" onclick="calcInput('.')">.</button>
                    <button class="calc-btn equal" onclick="calcInput('=')">=</button>
                </div>
            `;
            let currentExpression = '';
            const disp = document.getElementById('calc-display');

            window.calcInput = (value) => {
                if (value === 'C') {
                    currentExpression = '';
                    disp.innerText = '0';
                } else if (value === '=') {
                    try {
                        currentExpression = eval(currentExpression).toString();
                        disp.innerText = currentExpression;
                    } catch (e) {
                        disp.innerText = 'Ошибка';
                        currentExpression = '';
                    }
                } else {
                    if (currentExpression === '0' || disp.innerText === 'Ошибка') {
                        currentExpression = '';
                    }
                    currentExpression += value;
                    disp.innerText = currentExpression;
                }
            };
        }
    </script>
</body>
</html>
