<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TechSpecs Pro | Next-Gen Benchmark</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px 40px 15px;
            background: radial-gradient(circle at 50% -10%, #1c2541, #000000 80%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #0071e3, #42a5f5, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            color: #2997ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 18px;
        }

        /* Selectors */
        .selector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .select-box label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            background: rgba(28, 28, 30, 0.9);
            color: #fff;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 12px 10px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }

        /* Winner Badge Card */
        .winner-card {
            text-align: center;
            background: linear-gradient(135deg, rgba(0, 113, 227, 0.2), rgba(52, 199, 89, 0.15));
            border: 0.5px solid rgba(52, 199, 89, 0.4);
        }

        .winner-title {
            font-size: 11px;
            color: #34c759;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .winner-name {
            font-size: 20px;
            font-weight: 800;
        }

        /* Benchmarks */
        .bench-title {
            font-size: 12px;
            color: #86868b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .bar-group {
            margin-bottom: 16px;
        }

        .bar-group:last-child {
            margin-bottom: 0;
        }

        .bar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
        }

        .bar-fill-left {
            height: 100%;
            background: linear-gradient(90deg, #0071e3, #42a5f5);
            transition: width 0.5s ease;
        }

        .bar-fill-right {
            height: 100%;
            background: linear-gradient(90deg, #ff9f0a, #ffd60a);
            transition: width 0.5s ease;
        }

        /* Specs Table */
        .spec-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            padding: 10px 0;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }

        .spec-row:last-child {
            border-bottom: none;
        }

        .spec-name {
            color: #86868b;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .val {
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="title">TechSpecs Pro</h1>
            <a href="index.html" class="back-btn">‹ Главная</a>
        </div>

        <!-- Selectors -->
        <div class="glass-card selector-grid">
            <div class="select-box">
                <label style="color: #42a5f5;">Смартфон 1</label>
                <select id="dev1" onchange="compare()">
                    <!-- Options populated via JS -->
                </select>
            </div>
            <div class="select-box">
                <label style="color: #ffd60a;">Смартфон 2</label>
                <select id="dev2" onchange="compare()">
                    <!-- Options populated via JS -->
                </select>
            </div>
        </div>

        <!-- Winner Card -->
        <div class="glass-card winner-card">
            <div class="winner-title">Лидер по общей мощности</div>
            <div id="wName" class="winner-name">-</div>
        </div>

        <!-- Benchmarks Bar Comparison -->
        <div class="glass-card">
            <div class="bench-title">AnTuTu v10 Benchmark</div>
            <div class="bar-group">
                <div class="bar-labels">
                    <span id="antutu1" style="color: #42a5f5;">0</span>
                    <span id="antutu2" style="color: #ffd60a;">0</span>
                </div>
                <div class="bar-bg">
                    <div id="antutuBar1" class="bar-fill-left" style="width: 50%;"></div>
                    <div id="antutuBar2" class="bar-fill-right" style="width: 50%;"></div>
                </div>
            </div>

            <div class="bench-title">Geekbench 6 (Multi-Core)</div>
            <div class="bar-group">
                <div class="bar-labels">
                    <span id="geek1" style="color: #42a5f5;">0</span>
                    <span id="geek2" style="color: #ffd60a;">0</span>
                </div>
                <div class="bar-bg">
                    <div id="geekBar1" class="bar-fill-left" style="width: 50%;"></div>
                    <div id="geekBar2" class="bar-fill-right" style="width: 50%;"></div>
                </div>
            </div>

            <div class="bench-title">Genshin Impact (Ultra FPS)</div>
            <div class="bar-group">
                <div class="bar-labels">
                    <span id="fps1" style="color: #42a5f5;">0 FPS</span>
                    <span id="fps2" style="color: #ffd60a;">0 FPS</span>
                </div>
                <div class="bar-bg">
                    <div id="fpsBar1" class="bar-fill-left" style="width: 50%;"></div>
                    <div id="fpsBar2" class="bar-fill-right" style="width: 50%;"></div>
                </div>
            </div>
        </div>

        <!-- Hardware Specs -->
        <div class="glass-card">
            <div class="bench-title" style="margin-bottom: 8px;">Спецификации железа</div>
            <div class="spec-row">
                <span id="proc1" class="val">-</span>
                <span class="spec-name">Чипсет</span>
                <span id="proc2" class="val">-</span>
            </div>
            <div class="spec-row">
                <span id="hz1" class="val">-</span>
                <span class="spec-name">Дисплей</span>
                <span id="hz2" class="val">-</span>
            </div>
            <div class="spec-row">
                <span id="charge1" class="val">-</span>
                <span class="spec-name">Зарядка</span>
                <span id="charge2" class="val">-</span>
            </div>
            <div class="spec-row">
                <span id="battery1" class="val">-</span>
                <span class="spec-name">Батарея</span>
                <span id="battery2" class="val">-</span>
            </div>
        </div>
    </div>

    <script>
        const db = {
            iqoo12: { name: "iQOO 12", antutu: 2120000, geek: 6800, fps: 59, proc: "Snapdragon 8 Gen 3", hz: "144 Hz AMOLED", charge: "120W", bat: "5000 mAh" },
            iqoo_neo9: { name: "iQOO Neo 9 Pro", antutu: 2050000, geek: 6600, fps: 59, proc: "Dimensity 9300", hz: "144 Hz LTPO", charge: "120W", bat: "5160 mAh" },
            xiaomi14: { name: "Xiaomi 14", antutu: 1980000, geek: 6700, fps: 58, proc: "Snapdragon 8 Gen 3", hz: "120 Hz LTPO", charge: "90W", bat: "4610 mAh" },
            xiaomi13t_pro: { name: "Xiaomi 13T Pro", antutu: 1510000, geek: 5400, fps: 54, proc: "Dimensity 9200+", hz: "144 Hz AMOLED", charge: "120W", bat: "5000 mAh" },
            poco_f6_pro: { name: "POCO F6 Pro", antutu: 1550000, geek: 5300, fps: 53, proc: "Snapdragon 8 Gen 2", hz: "120 Hz AMOLED", charge: "120W", bat: "5000 mAh" },
            poco_x6_pro: { name: "POCO X6 Pro", antutu: 1320000, geek: 4700, fps: 50, proc: "Dimensity 8300 Ultra", hz: "120 Hz AMOLED", charge: "67W", bat: "5000 mAh" },
            realme_gt5_pro: { name: "Realme GT 5 Pro", antutu: 2080000, geek: 6750, fps: 59, proc: "Snapdragon 8 Gen 3", hz: "144 Hz AMOLED", charge: "100W", bat: "5400 mAh" },
            samsung_s24_ultra: { name: "Samsung S24 Ultra", antutu: 1950000, geek: 6900, fps: 57, proc: "Snapdragon 8 Gen 3", hz: "120 Hz Dynamic", charge: "45W", bat: "5000 mAh" },
            iphone15pro: { name: "iPhone 15 Pro Max", antutu: 1640000, geek: 7200, fps: 56, proc: "Apple A17 Pro", hz: "120 Hz ProMotion", charge: "27W", bat: "4422 mAh" }
        };

        function populateSelects() {
            const s1 = document.getElementById('dev1');
            const s2 = document.getElementById('dev2');

            s1.innerHTML = "";
            s2.innerHTML = "";

            const keys = Object.keys(db);
            keys.forEach((key, index) => {
                const opt1 = document.createElement('option');
                opt1.value = key;
                opt1.innerText = db[key].name;
                s1.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = key;
                opt2.innerText = db[key].name;
                s2.appendChild(opt2);
            });

            // Set defaults
            s1.value = "iqoo12";
            s2.value = "xiaomi14";
        }

        function compare() {
            const d1 = db[document.getElementById('dev1').value];
            const d2 = db[document.getElementById('dev2').value];

            // Winner logic (Score based on benchmarks)
            const score1 = d1.antutu + (d1.geek * 100);
            const score2 = d2.antutu + (d2.geek * 100);

            if (score1 > score2) {
                document.getElementById('wName').innerText = d1.name + " 🏆";
            } else if (score2 > score1) {
                document.getElementById('wName').innerText = d2.name + " 🏆";
            } else {
                document.getElementById('wName').innerText = "Равные силы 🤝";
            }

            // AnTuTu Calc
            document.getElementById('antutu1').innerText = d1.name + ": " + d1.antutu.toLocaleString();
            document.getElementById('antutu2').innerText = d2.name + ": " + d2.antutu.toLocaleString();
            const totalAntutu = d1.antutu + d2.antutu;
            document.getElementById('antutuBar1').style.width = (d1.antutu / totalAntutu * 100) + "%";
            document.getElementById('antutuBar2').style.width = (d2.antutu / totalAntutu * 100) + "%";

            // Geekbench Calc
            document.getElementById('geek1').innerText = d1.name + ": " + d1.geek.toLocaleString();
            document.getElementById('geek2').innerText = d2.name + ": " + d2.geek.toLocaleString();
            const totalGeek = d1.geek + d2.geek;
            document.getElementById('geekBar1').style.width = (d1.geek / totalGeek * 100) + "%";
            document.getElementById('geekBar2').style.width = (d2.geek / totalGeek * 100) + "%";

            // FPS Calc
            document.getElementById('fps1').innerText = d1.name + ": " + d1.fps + " FPS";
            document.getElementById('fps2').innerText = d2.name + ": " + d2.fps + " FPS";
            const totalFps = d1.fps + d2.fps;
            document.getElementById('fpsBar1').style.width = (d1.fps / totalFps * 100) + "%";
            document.getElementById('fpsBar2').style.width = (d2.fps / totalFps * 100) + "%";

            // Specs
            document.getElementById('proc1').innerText = d1.proc;
            document.getElementById('proc2').innerText = d2.proc;
            document.getElementById('hz1').innerText = d1.hz;
            document.getElementById('hz2').innerText = d2.hz;
            document.getElementById('charge1').innerText = d1.charge;
            document.getElementById('charge2').innerText = d2.charge;
            document.getElementById('battery1').innerText = d1.bat;
            document.getElementById('battery2').innerText = d2.bat;
        }

        document.addEventListener("DOMContentLoaded", () => {
            populateSelects();
            compare();
        });
    </script>
</body>
                  </html>
